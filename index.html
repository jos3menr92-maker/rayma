    <meta name="keywords" content="debt tracker, loan tracker, bill tracker, personal finance app, net worth tracker, budget app, debt payoff, AI financial advisor" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rayma AI" />

    <meta name="twitter:image" content="https://raymaapp.base44.app/og-image.png" />

    <link rel="canonical" href="https://raymaapp.com/" />

    <!-- Structured data: rich product card in Google search results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Rayma AI",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web, iOS, Android",
      "description": "Free debt tracker and bill manager. Track loans, bills, budget, and net worth with an intelligent AI financial advisor.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "url": "https://raymaapp.com/"
    }
    </script>

    <!-- Dynamic canonical + og:url so the live published domain is always correct -->
    <script>
      (function () {
        try {
          var origin = window.location.origin;
          var can = document.querySelector('link[rel="canonical"]');
          if (can) can.setAttribute('href', origin + '/');
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (!ogUrl) { ogUrl = document.createElement('meta'); ogUrl.setAttribute('property', 'og:url'); document.head.appendChild(ogUrl); }
          ogUrl.setAttribute('content', origin + '/');
        } catch (e) {}
      })();
    </script>
    
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0dcfba" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <style>
      input, select, textarea { font-size: 16px !important; }
    </style>
    <title>Rayma AI — Smart Debt & Bills Tracker</title> 
  </head>
